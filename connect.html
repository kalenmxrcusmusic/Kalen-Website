    <style>
        /* ========================================
           CSS CUSTOM PROPERTIES (match index.html)
           ======================================== */
        :root {
            --bg-primary: #0a0a0a;
            --bg-surface: #161616;
            --bg-surface-alt: #1a1a1a;
            --border: #2a2a2a;
            --cream: #e8dcc8;
            --gold: #c9a84c;
            --gold-bright: #dbb85e;
            --white: #f5f0eb;
            --white-dim: rgba(245, 240, 235, 0.6);
            --font-display: 'Bebas Neue', sans-serif;
            --font-condensed: 'Barlow Condensed', sans-serif;
            --font-body: 'Barlow', sans-serif;
            --cashapp-green: #00D64F;
            --venmo-blue: #008CFF;
        }

        /* ========================================
           RESET & BASE
           ======================================== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-body);
            font-weight: 300;
            background: var(--bg-primary);
            color: var(--cream);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        img { max-width: 100%; display: block; }
        a { color: inherit; text-decoration: none; }
        a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

        .connect {
            max-width: 520px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        /* ========================================
           HERO
           ======================================== */
        .hero {
            position: relative;
            height: clamp(200px, 40vh, 360px);
            height: clamp(200px, 40svh, 360px);
            overflow: hidden;
        }
        @media (min-width: 521px) {
            .hero {
                -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
                mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
            }
        }
        .hero-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 22% center;
        }
        .hero-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,10,0.1) 0%, rgba(10,10,10,0.55) 55%, var(--bg-primary) 100%);
        }
        .hero-logo {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
        }
        .hero-logo img {
            width: 160px;
            filter: invert(1) brightness(0.9) sepia(0.15);
        }

        /* ========================================
           TIPS
           ======================================== */
        .tips {
            padding: 8px 20px 0;
            text-align: center;
        }
        .tips h1 {
            font-family: var(--font-display);
            font-weight: 400;
            font-size: 44px;
            letter-spacing: 1px;
            line-height: 1;
            color: var(--white);
        }
        .tips-sub {
            color: var(--white-dim);
            font-size: 16px;
            margin-top: 8px;
        }
        .pay-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
        }
        .pay-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 18px;
            min-height: 76px;
            background: var(--bg-surface);
            border: 1px solid var(--gold);
            border-radius: 14px;
            text-align: left;
            box-shadow: 0 0 15px rgba(201,168,76,0.12);
            transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
        }
        .pay-btn:hover {
            background: var(--bg-surface-alt);
            box-shadow: 0 0 25px rgba(201,168,76,0.3);
            transform: translateY(-2px);
        }
        .pay-btn:active { transform: translateY(0); }
        .pay-icon {
            position: relative;
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }
        .pay-icon svg {
            position: relative;
            width: 100%;
            height: 100%;
        }
        /* Cash App: green tile with a white $ (the mark's $ is a cutout) */
        .pay-icon.cashapp::before {
            content: '';
            position: absolute;
            top: 4px; bottom: 4px; left: 10px; right: 10px;
            background: #fff;
        }
        .pay-icon.cashapp svg { fill: var(--cashapp-green); }
        /* Venmo: blue tile with the white V from the Venmo mark */
        .pay-icon.venmo {
            background: var(--venmo-blue);
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pay-icon.venmo svg { width: 26px; height: 26px; fill: #fff; }
        .pay-text { flex: 1; }
        .pay-name {
            font-family: var(--font-condensed);
            font-weight: 700;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--white);
            line-height: 1.1;
        }
        .pay-handle {
            font-size: 15px;
            font-weight: 400;
            color: var(--gold);
        }
        .pay-chevron {
            width: 18px;
            height: 18px;
            color: var(--gold);
            flex-shrink: 0;
        }

        /* ========================================
           LABELS
           ======================================== */
        .label {
            font-family: var(--font-condensed);
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            text-align: center;
            margin-bottom: 14px;
        }

        /* ========================================
           FOLLOW
           ======================================== */
        .follow { padding: 40px 20px 0; }
        .socials {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .socials a {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-surface);
            color: var(--cream);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.25s ease, color 0.25s ease;
        }
        .socials a:hover { border-color: var(--gold); color: var(--gold); }
        .socials svg { width: 20px; height: 20px; }

        /* ========================================
           SHOWS
           ======================================== */
        .shows { padding: 40px 20px 0; }
        .show {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 4px;
            border-bottom: 1px solid var(--border);
        }
        .show:first-child { border-top: 1px solid var(--border); }
        a.show:hover { background: rgba(255,255,255,0.02); }
        .show-date { width: 48px; text-align: center; flex-shrink: 0; }
        .show-month {
            font-family: var(--font-condensed);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 2px;
            color: var(--gold);
        }
        .show-day {
            font-family: var(--font-display);
            font-size: 30px;
            color: var(--white);
            line-height: 1;
        }
        .show-info { flex: 1; min-width: 0; }
        .show-venue {
            font-family: var(--font-condensed);
            font-weight: 600;
            font-size: 19px;
            color: var(--white);
            line-height: 1.2;
        }
        .show-meta { font-size: 14px; color: var(--white-dim); }
        .show-pin {
            width: 18px;
            height: 18px;
            color: var(--gold);
            flex-shrink: 0;
        }
        .shows-note {
            text-align: center;
            color: var(--white-dim);
            font-size: 15px;
            padding: 8px 0;
        }
        .shows-note a { color: var(--gold); }
        .shows-all {
            display: block;
            text-align: center;
            margin-top: 16px;
            font-family: var(--font-condensed);
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cream);
        }
        .shows-all:hover { color: var(--gold); }

        /* ========================================
           FULL SITE + FOOTER
           ======================================== */
        .full-site {
            display: block;
            width: fit-content;
            margin: 40px auto 0;
            font-family: var(--font-condensed);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            padding: 12px 32px;
            border: 1.5px solid var(--gold);
            border-radius: 50px;
            transition: background 0.3s ease, color 0.3s ease;
        }
        .full-site:hover { background: var(--gold); color: var(--bg-primary); }
        .footer {
            text-align: center;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            font-size: 13px;
            color: var(--white-dim);
        }
        .footer a { color: var(--gold); }

        @media (prefers-reduced-motion: reduce) {
            .pay-btn, .pay-btn:hover { transition: none; transform: none; }
        }
    </style>

    <script>
        // ========================================
        // NEXT SHOWS (same Google Sheet as index.html)
        // ========================================
        const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSBUCgUawF-QLV02hU_0o-bxTDK-ivFnabApvGS-J1U-IMQzBmdgVvwAG_VZkb4EQ3Pg4A_nlJ4rFD7/pub?output=csv';
        const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
        const MAX_SHOWS = 4;
        const PIN_SVG = '<svg class="show-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>';

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            return lines.slice(1).map(line => {
                const values = []; let current = ''; let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    if (line[i] === '"') inQuotes = !inQuotes;
                    else if (line[i] === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
                    else current += line[i];
                }
                values.push(current.trim());
                const obj = {};
                headers.forEach((h, idx) => { obj[h.toLowerCase()] = (values[idx] || '').replace(/^"|"$/g, ''); });
                return obj;
            });
        }

        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text) node.textContent = text;
            return node;
        }

        function renderEmpty(container) {
            container.innerHTML = '<p class="shows-note">New dates coming soon.<br>Follow on <a href="https://www.instagram.com/kalenmxrcus/" target="_blank" rel="noopener">Instagram</a> for announcements.</p>';
        }

        function renderShows(shows) {
            const container = document.getElementById('showsList');
            const today = new Date(); today.setHours(0,0,0,0);
            const upcoming = shows
                .map(s => ({ ...s, when: new Date((s.date || '').trim() + 'T00:00:00') }))
                .filter(s => !isNaN(s.when) && s.when >= today && (s.status || '').trim().toLowerCase() !== 'cancelled')
                .sort((a, b) => a.when - b.when);

            if (upcoming.length === 0) { renderEmpty(container); return; }

            const list = document.createElement('div');
            upcoming.slice(0, MAX_SHOWS).forEach(show => {
                const address = (show.address || '').trim();
                const time = (show.time || '').trim();
                const row = address ? el('a', 'show') : el('div', 'show');
                if (address) {
                    row.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
                    row.target = '_blank';
                    row.rel = 'noopener';
                }

                const date = el('div', 'show-date');
                date.append(el('div', 'show-month', MONTHS[show.when.getMonth()]), el('div', 'show-day', String(show.when.getDate())));

                const info = el('div', 'show-info');
                const place = [show.city, show.state].filter(Boolean).join(', ');
                info.append(el('div', 'show-venue', show.venue || 'TBA'), el('div', 'show-meta', [place, time].filter(Boolean).join(' · ')));

                row.append(date, info);
                if (address) row.insertAdjacentHTML('beforeend', PIN_SVG);
                list.appendChild(row);
            });

            container.innerHTML = '';
            container.appendChild(list);
            if (upcoming.length > MAX_SHOWS) {
                const all = el('a', 'shows-all', 'See All Dates');
                all.href = '/#shows';
                container.appendChild(all);
            }
        }

        async function loadShows() {
            try {
                const res = await fetch(SHEET_CSV_URL);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                renderShows(parseCSV(await res.text()));
            } catch (err) {
                console.error('Failed to load shows:', err);
                renderEmpty(document.getElementById('showsList'));
            }
        }
        loadShows();
    </script>
</body>
</html>
